    The favicon, as a file convention: Next serves this at /icon.svg and links
    it in <head> on every page. SVG rather than a .ico so it stays crisp on a
    high-density display and weighs a few hundred bytes.

    THE MARK CHANGED 2026-09-16, with the logo. It was the framed star from the
    old brand artwork; it is the leaf now, and the two paths below are copied
    verbatim from `components/brand/Logo.jsx` (a 64 x 64 box, scaled here) so
    the tab and the masthead cannot drift apart.

    `evenodd` is load-bearing: the spiral is a HOLE struck out of the blade, and
    without the rule it paints as a second solid shape on top of it.

    The colours are written literally because this file is served on its own and
    never sees a stylesheet. #065f46 is --es-emerald-800, the same green the
    site uses for its accent.
  -->
