<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Eventsli">
  <!--
    The favicon, as a file convention: Next serves this at /icon.svg and links
    it in <head> on every page.

    THE E CARD, 2026-11-15: the logo's symbol, a yellow ticket with a capital
    E. The two paths below are copied verbatim from `components/brand/markPath.js`
    (scaled here); `test/logo.test.jsx` fails if they ever differ, so the tab
    and the masthead cannot drift apart.

    BARE, with no tile. The near-black E on the yellow card is 12.5:1, so the
    mark reads in a light tab bar and a dark one alike.

    The colours are written literally because this file is served on its own and
    never sees a stylesheet: #ffcc00 Sunshine Yellow, #111018 Near Black.
  -->
  <g transform="translate(15.00 14.50) scale(0.14286)">
    <path d="M11.2 -98H107.8A11.2 11.2 0 0 1 119 -86.8V-53.5A14 14 0 0 0 119 -25.5V7.8A11.2 11.2 0 0 1 107.8 19H11.2A11.2 11.2 0 0 1 0 7.8V-25.5A14 14 0 0 0 0 -53.5V-86.8A11.2 11.2 0 0 1 11.2 -98Z" fill="#ffcc00"/>
    <path d="M83.9-1.3L35.1-1.3L35.1-77.7L83.9-77.7L83.9-61.3L51.5-61.3L51.5-50.4L76.4-50.4L76.4-34.0L51.5-34.0L51.5-17.6L83.9-17.6L83.9-1.3Z" fill="#111018"/>
  </g>
