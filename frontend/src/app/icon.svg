<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Eventsli">
  <!--
    The favicon, as a file convention: Next serves this at /icon.svg and links
    it in <head> on every page. SVG rather than a .ico so it stays crisp on a
    high-density display and weighs a few hundred bytes.

    THE FRAMED STAR, 2026-10-16, with the brand guide. The two paths below are
    copied verbatim from `components/brand/markPath.js` (a 512 x 500 box, scaled
    here); `test/logo.test.js` fails if they ever differ, so the tab and the
    masthead cannot drift apart.

    A WHITE STAR ON A TEAL TILE, the guide's reversed logo, rather than the teal
    star alone. A browser tab is white in one theme and near-black in the other,
    and the brand teal measures 7.9:1 on the first but about 2:1 on the second:
    a bare mark would all but vanish from every dark-mode tab bar. The tile
    reads on both.

    `evenodd` on the frame is load-bearing: its second subpath is the window
    the star sits in, and without the rule it paints as a solid square.

    The colours are written literally because this file is served on its own and
    never sees a stylesheet. #0d5b5e is the guide's Teal (--es-teal-700).
  -->
  <rect width="32" height="32" rx="7" fill="#0d5b5e"/>
  <g transform="translate(6.78 7) scale(0.036)" fill="#ffffff">
    <path fill-rule="evenodd" d="M90 0H420L512 90V432H420V500H92V432H0V90ZM92 70V432H420V70Z"/>
    <path d="M256 118L284.2 204.7H375.4L301.7 258.3L329.8 345L256 291.5L182.2 345L210.3 258.3L136.6 204.7H227.8Z"/>
  </g>
</svg>
