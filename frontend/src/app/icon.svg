<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Eventsli">
  <!--
    The favicon, as a file convention: Next serves this at /icon.svg and links
    it in <head> on every page.

    THE E-TICKET, 2026-11-15. The two paths below are copied verbatim from
    `components/brand/markPath.js` (a 460-unit grid, scaled here);
    `test/logo.test.jsx` fails if they ever differ, so the tab and the masthead
    cannot drift apart.

    BARE, with no tile. The near-black E on the yellow ticket is 12.5:1, so the
    mark reads in a light tab bar and a dark one alike.

    The colours are written literally because this file is served on its own and
    never sees a stylesheet: #ffcc00 Sunshine Yellow, #111018 Near Black.
  -->
  <g transform="translate(0.5 0.5) scale(0.06739)">
    <path d="M100 0H360A100 100 0 0 1 460 100V180A50 50 0 0 0 460 280V360A100 100 0 0 1 360 460H100A100 100 0 0 1 0 360V280A50 50 0 0 0 0 180V100A100 100 0 0 1 100 0Z" fill="#ffcc00"/>
    <path d="M130 115H330V170H190V202.5H295V257.5H190V290H330V345H130Z" fill="#111018"/>
  </g>
</svg>
