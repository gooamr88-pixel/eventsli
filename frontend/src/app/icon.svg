<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Eventsli">
  <!--
    The favicon, as a file convention: Next serves this at /icon.svg and links
    it in <head> on every page.

    THE YELLOW TICKET, 2026-11-15. The two paths below are copied verbatim from
    `components/brand/markPath.js` (scaled here); `test/logo.test.jsx` fails if
    they ever differ, so the tab and the masthead cannot drift apart. Write it
    again with scripts/brandIcons.js after a redraw.

    ON A NEAR-BLACK TILE rather than bare. The sheet's yellow is 1.5:1 on a
    white tab bar and would all but vanish there; on the near-black it reads in
    a light browser and a dark one alike.

    The colours are written literally because this file is served on its own and
    never sees a stylesheet: #111018 Near Black, #ffcc00 Sunshine Yellow.
  -->
