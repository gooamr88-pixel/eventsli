# Airplane mode: admitted on the phone, a second scan is a duplicate, and the
# admission uploads once when the signal returns.
appId: com.eventsli.checkin
---
- runFlow: _signin-and-open-gala.yaml
- extendedWaitUntil:
    visible: "[0-9]+ · .*"
    timeout: 30000
- tapOn: "Start Check-in"
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible: "You’re Offline"
    timeout: 15000
- tapOn: "Continue Scanning"
- runFlow: { file: _scan.yaml, env: { CODE: "${QR_MICHAEL_1}" } }
- assertVisible: "Check-in Successful"
- assertVisible: "Saved on this phone.*"
- tapOn: "Scan Next"
- runFlow: { file: _scan.yaml, env: { CODE: "${QR_MICHAEL_1}" } }
- assertVisible: "Already Checked In"
- tapOn: "Scan Another"
- back
- assertVisible: "1 check-in waiting to sync"
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: "1 check-in waiting to sync"
    timeout: 45000
