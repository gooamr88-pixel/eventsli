appId: com.eventsli.checkin
---
- runFlow: _open.yaml
- tapOn: "Email"
- inputText: ${ORGANIZER_EMAIL}
- tapOn: "Password"
- inputText: ${PASSWORD}
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Annual Gala 2026 (Demo)"
    timeout: 20000
# The event's preview sheet, then its Start Check-in opens the door.
- tapOn: "Annual Gala 2026 (Demo)"
- extendedWaitUntil:
    visible: "Start Check-in"
    timeout: 10000
- tapOn: "Start Check-in"
# The dashboard: its own Start Check-in, under the counts.
- extendedWaitUntil:
    visible: "Recent Check-ins"
    timeout: 20000
