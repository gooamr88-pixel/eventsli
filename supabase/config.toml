# ═══════════════════════════════════════════════════════════════════════════
# Local Supabase — what `supabase start` boots, on a laptop and in CI.
#
# The integration suite talks to PostgREST over HTTP, not to Postgres directly,
# so proving the migrations apply is not enough: a policy, a schema-cache miss
# or an ambiguous embedded join is invisible to psql and fatal to the API. This
# config gives that suite a real stack to run against, with no project secrets
# and nothing written to the production database.
#
# Everything the API does not use is off. The suite needs Postgres and the REST
# gateway; Studio, Storage, Realtime, the edge runtime and the mail catcher are
# minutes of container pulls for nothing.
#
# `auth` stays ON despite the API using its own identity (see
# 20260829140000_own_auth.sql). Not for GoTrue itself — for the `auth` schema it
# creates at boot, which the base migration still references.
# ═══════════════════════════════════════════════════════════════════════════

project_id = "eventsli"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# THE SAME CAP AS PRODUCTION (Supabase's default, 1000) — deliberately.
#
# This was 5000, "above any single page the suite reads". That is what hid a
# real bug: both seat-map reads asked for every seat in one request, so a room
# of more than 1,000 seats was silently cut to 1,000 in production and never in
# a test. A truncation the tests cannot see is exactly the one that ships. Reads
# that need everything page through utils/fetchAll.js; a test that trips over
# this cap has found the next one.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 16

[auth]
enabled = true
site_url = "http://localhost:3000"

[studio]
enabled = false

[storage]
enabled = false

[realtime]
enabled = false

[inbucket]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
